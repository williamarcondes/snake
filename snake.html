<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Snake Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            flex-direction: column;
            gap: 15px;
            overflow: hidden;
        }

        .game-container {
            background: #16213e;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #e0e0e0;
        }

        .score-board {
            display: flex;
            gap: 25px;
            font-size: 18px;
        }

        .score-board span {
            background: #0f3460;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: bold;
        }

        .score-board .label { color: #e94560; }
        .score-board .value { color: #00ff88; }

        canvas {
            display: block;
            border-radius: 10px;
            background: #0a0a1a;
            border: 2px solid #0f3460;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal {
            background: #16213e;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            color: white;
            box-shadow: 0 0 60px rgba(0,255,136,0.15);
            border: 1px solid #0f3460;
        }

        .modal h1 { font-size: 36px; margin-bottom: 10px; }
        .modal p { color: #aaa; margin-bottom: 25px; font-size: 16px; }
        .modal .final-score { font-size: 48px; color: #00ff88; font-weight: bold; }

        button {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
        }

        .controls-info {
            color: #555;
            font-size: 13px;
            text-align: center;
        }

        /* Mobile controls */
        .mobile-controls {
            display: none;
            gap: 5px;
        }

        .d-pad {
            display: grid;
            grid-template-areas:
                ". up ."
                "left . right"
                ". down .";
            gap: 5px;
        }

        .d-pad button {
            width: 60px; height: 60px;
            padding: 0; font-size: 24px;
            border-radius: 12px;
            background: #0f3460;
        }

        .d-pad button:nth-child(1) { grid-area: up; }
        .d-pad button:nth-child(2) { grid-area: left; }
        .d-pad button:nth-child(3) { grid-area: right; }
        .d-pad button:nth-child(4) { grid-area: down; }

        @media (max-width: 500px) {
            .mobile-controls { display: flex; justify-content: center; margin-top: 10px; }
        }

        .game-over-text { color: #e94560; font-size: 28px; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h2 style="color:#e94560;">🐍 Snake</h2>
        <div class="score-board">
            <span class="label">Pontos: <span class="value" id="score">0</span></span>
            <span class="label">Recorde: <span class="value" id="highScore">0</span></span>
        </div>
    </header>

    <canvas id="gameCanvas" width="400" height="400"></canvas>
</div>

<div class="mobile-controls">
    <div class="d-pad">
        <button onclick="setDirection('up')">▲</button>
        <button onclick="setDirection('left')">◀</button>
        <button onclick="setDirection('right')">▶</button>
        <button onclick="setDirection('down')">▼</button>
    </div>
</div>

<div class="controls-info">Use as setas do teclado ou WASD para jogar</div>

<!-- Start Screen -->
<div class="overlay" id="startScreen">
    <div class="modal">
        <h1>🐍 Snake Game</h1>
        <p>Coma as maçãs e cresça! Não bata nas paredes ou em si mesmo.</p>
        <button onclick="startGame()">▶ Jogar</button>
    </div>
</div>

<!-- Game Over Screen -->
<div class="overlay" id="gameOverScreen" style="display:none;">
    <div class="modal">
        <div class="game-over-text">💀 Game Over!</div>
        <p>Sua pontuação:</p>
        <div class="final-score" id="finalScore">0</div>
        <br><br>
        <button onclick="startGame()">🔄 Jogar Novamente</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Configurações
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    let gameSpeed = 120;
    let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
    document.getElementById('highScore').textContent = highScore;

    let snake, food, direction, nextDirection, score, gameLoop, isRunning;

    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('gameOverScreen').style.display = 'none';

        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        gameSpeed = 120;
        isRunning = true;

        document.getElementById('score').textContent = score;
        placeFood();
        clearInterval(gameLoop);
        gameLoop = setInterval(update, gameSpeed);
    }

    function placeFood() {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        // Garantir que a comida não apareça na cobra
        for (let part of snake) {
            if (part.x === food.x && part.y === food.y) {
                placeFood();
                return;
            }
        }
    }

    function update() {
        direction = { ...nextDirection };

        const head = {
            x: snake[0].x + direction.x,
            y: snake[0].y + direction.y
        };

        // Verificar colisão com paredes
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            return gameOver();
        }

        // Verificar colisão consigo mesma
        for (let part of snake) {
            if (part.x === head.x && part.y === head.y) {
                return gameOver();
            }
        }

        snake.unshift(head);

        // Verificar se comeu a comida
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById('score').textContent = score;

            // Aumentar velocidade a cada 50 pontos
            if (score % 50 === 0 && gameSpeed > 60) {
                gameSpeed -= 10;
                clearInterval(gameLoop);
                gameLoop = setInterval(update, gameSpeed);
            }

            placeFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        // Fundo
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grid sutil
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < tileCount; i++) {
            ctx.beginPath();
            ctx.moveTo(i * gridSize, 0);
            ctx.lineTo(i * gridSize, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * gridSize);
            ctx.lineTo(canvas.width, i * gridSize);
            ctx.stroke();
        }

        // Cobra
        snake.forEach((part, index) => {
            const ratio = 1 - (index / snake.length) * 0.5;
            const r = Math.round(0 * ratio);
            const g = Math.round(255 * ratio);
            const b = Math.round(136 * ratio);

            // Corpo
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = index === 0 ? 15 : 5;
            ctx.beginPath();
            ctx.roundRect(
                part.x * gridSize + 1,
                part.y * gridSize + 1,
                gridSize - 2,
                gridSize - 2,
                4
            );
            ctx.fill();

            // Olhos na cabeça
            if (index === 0) {
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                let eyeOffsetX1, eyeOffsetY1, eyeOffsetX2, eyeOffsetY2;

                if (direction.x === 1) { // direita
                    eyeOffsetX1 = 12; eyeOffsetY1 = 5;
                    eyeOffsetX2 = 12; eyeOffsetY2 = 13;
                } else if (direction.x === -1) { // esquerda
                    eyeOffsetX1 = 6; eyeOffsetY1 = 5;
                    eyeOffsetX2 = 6; eyeOffsetY2 = 13;
                } else if (direction.y === -1) { // cima
                    eyeOffsetX1 = 5; eyeOffsetY1 = 6;
                    eyeOffsetX2 = 13; eyeOffsetY2 = 6;
                } else { // baixo
                    eyeOffsetX1 = 5; eyeOffsetY1 = 12;
                    eyeOffsetX2 = 13; eyeOffsetY2 = 12;
                }

                ctx.beginPath();
                ctx.arc(part.x * gridSize + eyeOffsetX1, part.y * gridSize + eyeOffsetY1, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(part.x * gridSize + eyeOffsetX2, part.y * gridSize + eyeOffsetY2, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // Pupilas
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.arc(part.x * gridSize + eyeOffsetX1, part.y * gridSize + eyeOffsetY1, 1.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(part.x * gridSize + eyeOffsetX2, part.y * gridSize + eyeOffsetY2, 1.2, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        ctx.shadowBlur = 0;

        // Comida (maçã)
        const foodCenter = food.x * gridSize + gridSize / 2;
        const foodTop = food.y * gridSize + gridSize / 2 - 5;

        // Brilho da comida
        ctx.shadowColor = '#e94560';
        ctx.shadowBlur = 15;

        ctx.fillStyle = '#e94560';
        ctx.beginPath();
        ctx.arc(foodCenter, foodTop + 2, gridSize / 2 - 2, 0, Math.PI * 2);
        ctx.fill();

        // Talinho da maçã
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#4a2';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(foodCenter, food.y * gridSize + 3);
        ctx.quadraticCurveTo(foodCenter + 3, food.y * gridSize - 1, foodCenter + 5, food.y * gridSize - 2);
        ctx.stroke();

        // Folha
        ctx.fillStyle = '#4a2';
        ctx.beginPath();
        ctx.ellipse(foodCenter + 4, food.y * gridSize - 1, 3, 1.5, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
    }

    function gameOver() {
        isRunning = false;
        clearInterval(gameLoop);

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('snakeHighScore', highScore);
            document.getElementById('highScore').textContent = highScore;
        }

        document.getElementById('finalScore').textContent = score;
        document.getElementById('gameOverScreen').style.display = 'flex';
    }

    function setDirection(dir) {
        const dirs = {
            up:    { x: 0, y: -1 },
            down:  { x: 0, y: 1 },
            left:  { x: -1, y: 0 },
            right: { x: 1, y: 0 }
        };
        const newDir = dirs[dir];
        // Evitar reversão (não pode ir direto para o sentido oposto)
        if (newDir.x !== -direction.x && newDir.y !== -direction.y) {
            nextDirection = newDir;
        }
    }

    document.addEventListener('keydown', (e) => {
        const keyMap = {
            ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
            w: 'up', s: 'down', a: 'left', d: 'right',
            W: 'up', S: 'down', A: 'left', D: 'right'
        };

        if (keyMap[e.key]) {
            e.preventDefault();
            setDirection(keyMap[e.key]);
        }

        // Espaço para iniciar/reiniciar
        if (e.key === ' ' || e.key === 'Enter') {
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            if (!isRunning && startScreen.style.display !== 'none') {
                startGame();
            }
        }
    });
    </script>
    </body>
</html>
